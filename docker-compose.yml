services:
  # ============================================================================
  # Frontend & Landing Page Service (Next.js 16 + Standalone + Static Templates)
  # ============================================================================
  web:
    container_name: nuptia-web
    build:
      context: .
      dockerfile: frontend/home/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================================================
  # Nginx Reverse Proxy (Gzip, Static Caching, Port 80/443 Routing)
  # ============================================================================
  nginx:
    container_name: nuptia-nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    depends_on:
      web:
        condition: service_healthy
    networks:
      - app-network

  # ============================================================================
  # Certbot (Opsional untuk otomatisasi SSL Let's Encrypt di VPS)
  # Jalankan dengan: docker compose --profile ssl up -d
  # ============================================================================
  certbot:
    container_name: nuptia-certbot
    image: certbot/certbot:latest
    profiles: ["ssl"]
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"
    networks:
      - app-network

  # ============================================================================
  # Backend API Service (Siap digunakan saat modul backend/ dikembangkan)
  # Aktifkan blok ini setelah membuat Dockerfile di direktori backend/
  # ============================================================================
  # api:
  #   container_name: nuptia-api
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   restart: unless-stopped
  #   environment:
  #     - NODE_ENV=production
  #     - PORT=5000
  #   ports:
  #     - "${API_PORT:-5000}:5000"
  #   networks:
  #     - app-network

networks:
  app-network:
    driver: bridge

volumes:
  certbot-etc:
  certbot-var:
